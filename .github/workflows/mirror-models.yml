name: Copia modelli

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install onnx
      - name: Scarica, calcola checksum, pubblica nella release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/mirror_models.py
      - name: Salva models.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add models.json
          git diff --cached --quiet || (git commit -m "Aggiorna models.json" && git push)
