name: Elenco repository Hugging Face
on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Repository separati da spazio"
        required: true
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/hf_list.py ${{ github.event.inputs.repos }}
