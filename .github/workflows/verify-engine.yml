name: Verifica motore (test con modello vero)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Nome del modello (htdemucs, htdemucs_6s, htdemucs_ft)"
        default: "htdemucs"
  push:
    paths:
      - "core/**"
      - ".github/workflows/verify-engine.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Scarica il modello dalle Releases
        run: |
          M="${{ github.event.inputs.model || 'htdemucs' }}"
          mkdir -p models
          base="https://github.com/${{ github.repository }}/releases/download/models-v1"
          if [ "$M" = "htdemucs_ft" ]; then
            for f in htdemucs_ft.json htdemucs_ft_0.json htdemucs_ft_1.json htdemucs_ft_2.json htdemucs_ft_3.json htdemucs_ft_0.onnx htdemucs_ft_1.onnx htdemucs_ft_2.onnx htdemucs_ft_3.onnx; do curl -fsSL -o models/$f "$base/$f"; done
          else
            curl -fsSL -o models/$M.json "$base/$M.json"; curl -fsSL -o models/$M.onnx "$base/$M.onnx"
          fi
          ls -la models
          echo "MLSTEMS_MODEL_JSON=$PWD/models/$M.json" >> $GITHUB_ENV
      - name: Test del motore
        run: gradle :core:test --no-daemon --info -i 2>&1 | grep -E "ROUNDTRIP|SEPARAZIONE|SOMMA|stem |confine|PASSED|FAILED|SKIPPED|errata|non ricostruisce|Exception|error:|e: |BUILD" | head -60
        shell: bash
