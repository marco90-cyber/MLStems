name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Se compilato (es. v0.1) pubblica l'APK in una release con questo nome"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK normale
        run: gradle assembleStandardDebug --no-daemon --stacktrace

      - name: Build APK sperimentale NPU
        run: gradle assembleNpuDebug -PlegacyJni=true --no-daemon --stacktrace

      - name: Diagnostica API QNN
        if: failure()
        run: |
          J=$(find ~/.gradle -name classes.jar -path '*onnxruntime-android-qnn*' | head -1); echo "$J"
          D=$(mktemp -d); (cd $D && unzip -oq "$J")
          javap -cp $D 'ai.onnxruntime.OrtSession$SessionOptions' | grep -iE "qnn|ExecutionProvider|Symbolic|ConfigEntry" || true

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk MLStems.apk
          cp app/build/outputs/apk/npu/debug/app-npu-debug.apk MLStems-NPU.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MLStems-debug-apk
          path: |
            MLStems.apk
            MLStems-NPU.apk

      - name: Pubblica release (tag v* oppure nome indicato a mano)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            MLStems.apk
            MLStems-NPU.apk
          generate_release_notes: true
