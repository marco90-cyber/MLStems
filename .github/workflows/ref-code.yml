name: Codice di riferimento (diagnostica)
on:
  workflow_dispatch:
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Demucs ONNX host code
        run: |
          git clone --depth 1 https://github.com/HRSadeghi/demucs-onnx.git d
          cd d && find . -name "*.py" -not -path "./.git/*" | head -30
          for f in $(find python -name "*.py" | head -12); do echo "#### $f"; wc -l $f; done
      - name: Print core files
        run: |
          cd d
          for f in $(find python -name "*.py" | grep -E "stft|spec|separat|infer|host|runner|apply|core" | head -6); do echo "#### $f"; cat $f; done
      - name: Spleeter ONNX
        run: |
          git clone --depth 1 https://github.com/madewith-bestpractice/spleeter-4stems-onnx.git s
          cd s && find . -type f -not -path "./.git/*" | head -40
          echo "#### README"; sed -n 1,200p README.md
