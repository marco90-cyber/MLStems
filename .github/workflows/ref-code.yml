name: Codice di riferimento (diagnostica)
on:
  workflow_dispatch:
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Spleeter ONNX codice
        run: |
          git clone --depth 1 https://github.com/madewith-bestpractice/spleeter-4stems-onnx.git s
          cd s
          for f in separate.py; do echo "#### $f"; cat $f; done
      - name: Demucs overlap
        run: |
          git clone --depth 1 https://github.com/HRSadeghi/demucs-onnx.git d
          echo "#### overlap.py"; cat d/python/demucs_onnx/overlap.py
